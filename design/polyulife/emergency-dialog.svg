<svg xmlns="http://www.w3.org/2000/svg" width="520" height="462" viewBox="0 0 520 462" fill="none"><title>Emergency Contact — Public Dialog</title><desc>Editable reconstruction from emergency-160129-public-contact-dialog.png, a 520 by 462 public dialog crop. This is a standalone dialog, not a complete app screen. Material blur replaced by neutral gray vector fills. Phone label is observed public contact text; no call was initiated. Cursor and hover omitted.</desc><rect id="ScreenBackground" width="520" height="462" fill="#FFFFFF"/><rect width="520" height="462" rx="59" fill="#686868"/><rect x="0.5" y="0.5" width="519" height="461" rx="58.5" stroke="#8B8B8B"/><text x="44" y="66" fill="#E5E5E5" font-family="sans-serif" font-size="27" font-weight="700">In the event of emergency such</text><text x="44" y="100" fill="#E5E5E5" font-family="sans-serif" font-size="27" font-weight="700">as crime, fire, flood threat to life</text><text x="44" y="133" fill="#E5E5E5" font-family="sans-serif" font-size="27" font-weight="700">etc, please first evacuate to a safe</text><text x="44" y="167" fill="#E5E5E5" font-family="sans-serif" font-size="27" font-weight="700">location and stay out of danger.</text><text x="44" y="235" fill="#E5E5E5" font-family="sans-serif" font-size="27" font-weight="700">Then, report the emergency to</text><text x="44" y="268" fill="#E5E5E5" font-family="sans-serif" font-size="27" font-weight="700">Campus Control Centre.</text><g id="CallEmergency"><rect x="32" y="306" width="456" height="56" rx="28" fill="#946360"/><text x="260" y="345" fill="#EB3E32" font-family="sans-serif" font-size="27" font-weight="400" text-anchor="middle">Call 27667666</text></g><g id="Close"><rect x="32" y="374" width="456" height="57" rx="28" fill="#797979"/><text x="260" y="413" fill="#DDDDDD" font-family="sans-serif" font-size="27" font-weight="500" text-anchor="middle">Close</text></g></svg>