<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="576" height="970" viewBox="0 0 576 970" fill="none">
  <title>Room Finder — Sept28 PQ sample initial</title>
  <desc>Editable finite reconstruction from public native source; fonts/icons/geometry approximate. Pointer/halo omitted. Initial 1060×1898 source uniformly scaled to576 width and lower blank61.37px clipped; other sources576×970. Keyboard P/B/BackSpace are prototype fixed-input proxies, not arbitrary native input. Initial three dates/no search retained; capture dimension difference does not prove asynchronous cause.</desc>
