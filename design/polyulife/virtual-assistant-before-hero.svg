<svg xmlns="http://www.w3.org/2000/svg" width="576" height="970" viewBox="0 0 576 970" fill="none"><title>Virtual Assistant — before hero appears</title><desc>Editable approximation of E-ASSISTANT-BEFORE-HERO, public native screenshot virtual-assistant-154604-before-hero.png. Hero/expand group absent; article moved upward203px against loaded source baselines. Native layout shift observed, duration unknown. Fonts/icons remain approximate; captured cursor/halo omitted. Prepared source only, not imported/wired/replayed.</desc><rect id="ScreenBackground" width="576" height="970" fill="#FFFFFF" /><g id="PageContent"><rect x="0" y="100" width="576" height="870" fill="#F7F9F6" /><rect x="18.5" y="100" width="539" height="870" fill="#FFFFFF" stroke="#CACFD0" /><g id="VirtualAssistantBody" transform="translate(0 -203)"><text x="35" y="355" fill="#111111" font-family="sans-serif" font-size="27" font-weight="700">Get Instant Assistance with Your</text><text x="35" y="391" fill="#111111" font-family="sans-serif" font-size="27" font-weight="700">Virtual Assistant!</text><path d="M35 422.5H542" stroke="#DFDFDF" stroke-width="1.5" /><g id="InformationIcon"><circle cx="45.5" cy="466.5" r="8.7" stroke="#B6B6B6" stroke-width="2.3" /><text x="45.5" y="471.5" fill="#B6B6B6" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">?</text></g><text x="64" y="474" fill="#333333" font-family="sans-serif" font-size="20.7" font-weight="400">As your Virtual Assistant, I'm here to help you find</text><text x="64" y="501" fill="#333333" font-family="sans-serif" font-size="20.7" font-weight="400">the information you need about your department.</text><text x="64" y="556" fill="#333333" font-family="sans-serif" font-size="20.7" font-weight="400">For instant answers to your questions, click</text><g id="VirtualAssistantWebLink"><text x="64" y="580" fill="#575757" font-family="sans-serif" font-size="28" font-weight="700">here</text><path d="M64 584H125" stroke="#575757" stroke-width="1.5" /></g><text x="69" y="612" fill="#333333" font-family="sans-serif" font-size="20.7" font-weight="400">to chat with me or visit the department website</text><text x="64" y="639" fill="#333333" font-family="sans-serif" font-size="20.7" font-weight="400">for the latest details.</text><text x="64" y="695" fill="#333333" font-family="sans-serif" font-size="20.7" font-weight="400">Enjoy exploring!</text></g></g><g id="Header"><rect x="0.5" y="0.5" width="575" height="99" fill="#FFFFFF" stroke="#E1E1E1" /><g id="Back"><path d="M34.5 57.5L27 65L34.5 72.5" stroke="#202020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="288" y="75.5" fill="#080808" font-family="sans-serif" font-size="27" font-weight="400" text-anchor="middle">Virtual Assistant</text></g></svg>