<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="576" height="970" viewBox="0 0 576 970"><title>Room Preview — browser menu</title><desc>Observed Room Preview viewport reconstruction. Editable text and vector controls; public photographs and wordmarks are raster. Native source screenshots define layout. Fonts/icons approximate; cursor omitted. Continuous-body extent is limited to observed photographs, not the complete official webpage. Configure scrolling and carousel component in Figma UI.</desc><g id="MenuDim"><rect width="576" height="970" fill="#000" fill-opacity=".70"/></g><g id="WebMenu"><rect x="18" y="640" width="540" height="258" rx="20" fill="#FFF"/><path d="M18 726H558M18 812H558" stroke="#E6E6E6"/><text x="288" y="693" font-family="Arial" font-size="28" font-weight="400" fill="#101010" text-anchor="middle">Open in system browser</text><text x="288" y="779" font-family="Arial" font-size="28" font-weight="400" fill="#101010" text-anchor="middle">Share via...</text><text x="288" y="865" font-family="Arial" font-size="28" font-weight="400" fill="#101010" text-anchor="middle">Copy link</text></g><g id="CancelMenu"><rect x="18" y="910" width="540" height="85" rx="20" fill="#FFF"/><text x="288" y="963" font-family="Arial" font-size="28" font-weight="400" fill="#FF0800" text-anchor="middle">Cancel</text></g></svg>