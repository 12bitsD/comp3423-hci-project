<svg xmlns="http://www.w3.org/2000/svg" width="576" height="970" viewBox="0 0 576 970" fill="none">
  <title>Room Finder — Room suggestion</title>
  <desc>Editable reconstruction from room-135612-a-suggestion.png. Native sans-serif text; font and vector icons are approximations. Cursor, hover effects and exterior window-capture fringe omitted. Search icon is reconstructed from the clearly visible same control in the other captured states.</desc>
  <defs>
    <clipPath id="DatesViewport">
      <rect x="30" y="100" width="516" height="84" />
    </clipPath>
  </defs>
  <rect id="ScreenBackground" width="576" height="970" fill="#FFFFFF" />
  <rect id="EmptyBackground" x="0" y="272" width="576" height="698" fill="#F4F4F4" />
  <g id="Header">
    <rect x="0.5" y="0.5" width="575" height="99" fill="#FFFFFF" stroke="#E1E1E1" />
    <path id="Back" d="M34.5 57.5L27 65L34.5 72.5" stroke="#202020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <text x="288" y="75.5" fill="#080808" font-family="sans-serif" font-size="27" text-anchor="middle">Room Finder</text>
  </g>
  <g id="Dates" clip-path="url(#DatesViewport)">
    <rect id="SelectedDate" x="126" y="112" width="80" height="67" rx="9" fill="#54B39F" />
    <g id="Date-Mon-28-Sep">
      <text x="70" y="140" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">Today</text>
      <text x="70" y="163" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">28-Sep</text>
    </g>
    <g id="Date-Tue-29-Sep">
      <text x="166" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="600" text-anchor="middle">Tue</text>
      <text x="166" y="163" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="600" text-anchor="middle">29-Sep</text>
    </g>
    <g id="Date-Wed-30-Sep">
      <text x="260" y="140" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">Wed</text>
      <text x="260" y="163" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">30-Sep</text>
    </g>
    <g id="Date-Thu-01-Oct">
      <text x="353" y="140" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">Thu</text>
      <text x="353" y="163" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">01-Oct</text>
    </g>
    <g id="Date-Fri-02-Oct">
      <text x="446" y="140" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">Fri</text>
      <text x="446" y="163" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">02-Oct</text>
    </g>
    <g id="Date-Sat-03-Oct">
      <text x="540" y="140" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">Sat</text>
      <text x="540" y="163" fill="#404040" font-family="sans-serif" font-size="17" text-anchor="middle">03-Oct</text>
    </g>
  </g>
  <g id="Search">
    <text x="31" y="228" fill="#090909" font-family="sans-serif" font-size="22">Room</text>
    <rect id="RoomInput" x="105.5" y="192" width="348" height="63" rx="9" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1.5" />
    <text id="RoomInputValue" x="122" y="233" fill="#090909" font-family="sans-serif" font-size="22">A</text>
    <g id="SearchButton">
      <rect x="477" y="191.5" width="69" height="64" rx="10" fill="#54B39F" />
      <circle cx="509.5" cy="221.5" r="9" stroke="#FFFFFF" stroke-width="3.5" />
      <path d="M516.1 228.1L522.2 234.2" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <path d="M0 271.5H576" stroke="#D5D5DA" stroke-width="1.4" />
    <g id="ClearInput">
      <path d="M417 216L432 231M432 216L417 231" stroke="#9DAFB9" stroke-width="3" stroke-linecap="square" />
    </g>
  </g>
  <g id="Suggestion">
    <rect x="105.5" y="257" width="348" height="62.5" rx="9" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1.5" />
    <text x="123" y="298.5" fill="#090909" font-family="sans-serif" font-size="22">AG206</text>
  </g>
  <g id="EmptyState">
    <g id="ClassroomIcon">
      <path d="M252 460V402Q252 397 257 395L286 388Q294 386 294 394V470H237V463Q237 460 240 460Z" fill="#31917D" />
      <path d="M299 398H316Q325 398 325 407V460H337Q340 460 340 463V470H314V409H299Z" fill="#31917D" />
      <ellipse cx="279" cy="429" rx="3.6" ry="4.8" fill="#F4F4F4" />
    </g>
    <text x="288" y="498" fill="#575757" font-family="sans-serif" font-size="25" font-weight="600" text-anchor="middle">Find an available classroom</text>
    <text x="288" y="530" fill="#9CAFB9" font-family="sans-serif" font-size="23" font-weight="500" text-anchor="middle">Enter room number to begin search</text>
  </g>
</svg>