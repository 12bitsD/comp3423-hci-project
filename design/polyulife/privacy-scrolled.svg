<svg xmlns="http://www.w3.org/2000/svg" width="576" height="970" viewBox="0 0 576 970" fill="none"><title>Privacy Policy — observed scrolled viewport</title><desc>Editable finite reconstruction of E-MENU-N-19. Only legible visible lines transcribed. Noncontiguous with initial page; no invented intermediate text, exact scroll offset or document boundaries. Approximate font/geometry. Cursor omitted. Top and bottom clipped fragments remain incomplete.</desc><rect width="576" height="970" fill="#F7F9F6"/><g id="EmbeddedPublicWebPage"><rect x="18.5" y="100" width="539" height="870" fill="white" stroke="#CACFD0"/><g id="ObservedBody"><text x="103" y="159.0" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">so long as necessary to fulfil the purpose</text><text x="103" y="192.1" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">of collection; and will erase your personal</text><text x="103" y="225.2" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">data thereafter. We will ensure the security</text><text x="103" y="258.3" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">of your personal data and protect them</text><text x="103" y="291.4" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">from unauthorised access.</text><text x="65" y="341" font-family="Roboto" font-size="21.7" fill="#A3273D">4.</text><text x="103" y="341.0" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">We will keep your personal data</text><text x="103" y="374.1" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">confidential. Your personal data will be</text><text x="103" y="407.2" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">used (and disclosed) to third parties for</text><text x="103" y="440.3" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">the purposes for which they were</text><text x="103" y="473.4" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">collected, and where we are required to do</text><text x="103" y="506.5" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">so by law and as specified in the relevant</text><text x="103" y="539.6" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">Personal Information Collection</text><text x="103" y="572.7" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">Statement.</text><text x="65" y="623" font-family="Roboto" font-size="21.7" fill="#A3273D">5.</text><text x="103" y="623.0" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">You have the right to request access to</text><text x="103" y="656.1" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">and correction of your personal data held</text><text x="103" y="689.2" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">by us. Any data access and correction</text><text x="103" y="722.3" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">request should be made in writing to the</text><text x="103" y="755.4" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">Departmental Personal Data Officer of the</text><text x="103" y="788.5" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">relevant department as specified in the</text><text x="103" y="821.6" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">relevant Personal Information Collection</text><text x="103" y="854.7" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">Statement or Data Protection Officer</text><text x="103" y="887.8" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">(dpo.email@polyu.edu.hk). Data access</text><text x="103" y="920.9" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">request should be made by completing</text><text x="103" y="954.0" font-family="Roboto" font-size="21.7" font-weight="400" fill="#292929">and submitting the Data Access Request</text><path d="M103 890 H351 M288 956 H494" stroke="#292929" stroke-width="1"/></g><rect x="19" y="101" width="519" height="53" fill="white"/><text x="81" y="135" font-family="Roboto" font-size="22" fill="#292929">Privacy Policy</text><rect x="540.5" y="102" width="14" height="814" rx="7" fill="white" stroke="#EEEEEE"/><rect x="525" y="402" width="13" height="216" rx="6.5" fill="#BFBFBF"/></g><g id="Header"><rect x="0.5" y="0.5" width="575" height="99" fill="white" stroke="#E1E1E1"/><g id="Back"><rect x="12" y="36" width="52" height="54" fill="white" fill-opacity="0.001"/><path d="M34.5 57.5L27 65L34.5 72.5" stroke="#202020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="288" y="75.5" fill="#141414" font-family="Roboto" font-size="27" text-anchor="middle">Privacy Policy</text></g></svg>
