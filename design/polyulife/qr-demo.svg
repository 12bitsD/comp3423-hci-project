<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="576" height="970" viewBox="0 0 576 970" fill="none"><title>My Campus Access QR — Non-scannable DEMO</title><desc>Editable interface reconstruction from qr-174024-code-and-identity-redacted.png. Viewport 576x970. Visible interface text and ordinary controls are editable SVG text and vectors. Fonts and icons approximate the observed native geometry; pointer shadows are omitted. SVG import provides no navigation, scrolling, text input, authentication or backend behavior. DEMO: personal names, subject identifiers, coursework, counts, schedules and identity content are wholly synthetic examples. No real private body text or image is embedded. Personal-page geometry was inspected locally, while shared evidence is intentionally cropped or masked. These examples are not evidence of any student record or an observed public page body. The entire native QR and identity regions were removed. The central illustration is a crossed rectangle with text, has no QR finder patterns or encoded payload, and cannot function as a campus credential. The bar uses an arbitrary demo fraction; its native meaning was not established. Only the visible instruction fragment is included; tapping help or scrolling did not confirm a new result.</desc><defs><clipPath id="ViewportClip"><rect width="576" height="970"/></clipPath><clipPath id="HomeContentClip"><rect y="100" width="576" height="820"/></clipPath></defs><g clip-path="url(#ViewportClip)"><rect x="0" y="0" width="576" height="970" rx="0" fill="#FFFFFF"/><text x="288" y="152" fill="#171717" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">Scan at the QR Code Reader</text><rect x="77" y="193" width="423" height="422" rx="69" fill="#DCEEDC"/><rect x="103" y="220" width="370" height="370" rx="42" fill="#F6F8F5"/><g id="NonScannableDemoPlaceholder"><rect x="116" y="234" width="345" height="345" rx="12" fill="#E6EBE5" stroke="#B4C5B7" stroke-width="2"/><path d="M155 315L421 499M421 315L155 499" stroke="#CAD5C9" stroke-width="7"/><text x="288" y="378" fill="#526551" font-family="sans-serif" font-size="36" font-weight="700" text-anchor="middle">DEMO</text><text x="288" y="422" fill="#526551" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">No QR code</text><text x="288" y="459" fill="#617660" font-family="sans-serif" font-size="19" font-weight="400" text-anchor="middle">Cannot be scanned</text></g><g id="DemoIdentity"><text x="288" y="674" fill="#171717" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">Student Example · DEMO</text></g><g id="UnverifiedStatusBar"><rect x="72" y="699" width="433" height="12" rx="6" fill="#EFEFEF"/><rect x="72" y="699" width="173" height="12" rx="6" fill="#B9D952"/></g><g id="HelpInfo"><circle cx="43" cy="813" r="11" stroke="#727783" stroke-width="2"/><text x="43" y="820" fill="#727783" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">?</text></g><text x="68" y="818" fill="#737986" font-family="sans-serif" font-size="22" font-weight="400">Please note that the QR Code provided is</text><text x="68" y="848" fill="#737986" font-family="sans-serif" font-size="22" font-weight="400">only for use by the student to whom the QR</text><text x="68" y="878" fill="#737986" font-family="sans-serif" font-size="22" font-weight="400">Code is assigned. Sharing or allowing</text><text x="68" y="908" fill="#737986" font-family="sans-serif" font-size="22" font-weight="400">others to use QR codes is strictly</text><rect x="560" y="103" width="13" height="731" rx="7" fill="#C6C6C6"/><g id="Header"><rect x="0.5" y="0.5" width="575" height="99" rx="0" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/><g id="Menu"><path d="M25 53H58M25 65H58M25 77H58" stroke="#151515" stroke-width="3.4" stroke-linecap="round"/></g><g id="Search"><circle cx="526" cy="63" r="13" stroke="#131313" stroke-width="3.5"/><path d="M535 73L542 80" stroke="#131313" stroke-width="3.5" stroke-linecap="round"/></g><text x="288" y="75" fill="#171717" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">My Campus Access QR</text><g id="DemoNotice"><rect x="444" y="7" width="116" height="25" rx="6" fill="#FFF0CF"/><text x="502" y="25" fill="#775313" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">DEMO DATA</text></g></g><g id="BottomNavigation"><rect x="0" y="920" width="576" height="50" rx="0" fill="#FFFFFF"/><g id="NavHome"><path d="M40 947L53 935L68 947V962H57V951H49V962H40Z" stroke="#9FB0B9" stroke-width="3.5" stroke-linejoin="round"/></g><g id="NavCalendar"><rect x="161" y="937" width="23" height="27" rx="1" stroke="#9FB0B9" stroke-width="4"/><path d="M166 932V941M179 932V941M164 944H182M166 951H179M166 957H179" stroke="#9FB0B9" stroke-width="3"/></g><g id="NavQR"><circle cx="288" cy="949" r="49" fill="#58B1A2"/><rect x="273" y="932" width="11" height="11" rx="0" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="294" y="932" width="11" height="11" rx="0" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="273" y="952" width="11" height="11" rx="0" fill="none" stroke="#FFFFFF" stroke-width="3"/><path d="M294 952H300V958H306V964H294V959H288" stroke="#FFFFFF" stroke-width="3"/></g><g id="NavNotification"><path d="M391 937H417V956H402L395 963V956H391Z" stroke="#9FB0B9" stroke-width="4" stroke-linejoin="round"/></g><g id="NavMore"><path d="M505 935H534V959H505ZM511 965H514M519 965H522M527 965H530" stroke="#9FB0B9" stroke-width="4"/></g></g></g></svg>