<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="576" height="970" viewBox="0 0 576 970"><title>Room Preview — loading sample</title><desc>Observed Room Preview viewport reconstruction. Editable text and vector controls; public photographs and wordmarks are raster. Native source screenshots define layout. Fonts/icons approximate; cursor omitted. Continuous-body extent is limited to observed photographs, not the complete official webpage. Configure scrolling and carousel component in Figma UI.</desc><rect x="0" y="0" width="576" height="970" rx="0" fill="#FFFFFF"/><rect x="8" y="152" width="561" height="44" rx="0" fill="#FFFFFF"/><path d="M527 152H569V196H486Z" fill="#A31D3C"/><rect x="8" y="196" width="561" height="94" rx="0" fill="#FFFFFF"/><text x="26" y="241" font-family="Arial" font-size="22" font-weight="700" fill="#383838">Information Technology Services</text><text x="26" y="264" font-family="Arial" font-size="22" font-weight="700" fill="#383838">Office</text><rect x="8" y="294" width="561" height="32" rx="0" fill="#A31D3C"/><text x="26" y="425" font-family="Arial" font-size="37" font-weight="400" fill="#A50032">Learning and Teaching</text><text x="26" y="481" font-family="Arial" font-size="37" font-weight="400" fill="#A50032">Technology Support</text><path d="M26 507H552" stroke="#A50032" stroke-width="2.5"/><text x="26" y="543" font-family="Arial" font-size="25" font-weight="400" fill="#101010">Computers and audio-visual equipment are</text><text x="26" y="587" font-family="Arial" font-size="25" font-weight="400" fill="#101010">provided in the general teaching classrooms</text><text x="26" y="631" font-family="Arial" font-size="25" font-weight="400" fill="#101010">(GT) and lecture theatres (LT) in support of a</text><text x="26" y="675" font-family="Arial" font-size="25" font-weight="400" fill="#101010">modern interactive teaching technology</text><text x="26" y="719" font-family="Arial" font-size="25" font-weight="400" fill="#101010">environment. You can teach face-to-face as</text><text x="26" y="763" font-family="Arial" font-size="25" font-weight="400" fill="#101010">well as remotely at the same time using the</text><text x="26" y="807" font-family="Arial" font-size="24" font-weight="400" fill="#101010">facilities in GT/LT. Your lecture can be recorded</text><text x="26" y="851" font-family="Arial" font-size="24" font-weight="400" fill="#101010">also using the software / VC tools in classroom</text><text x="26" y="895" font-family="Arial" font-size="25" font-weight="400" fill="#101010">desktop computer. You can check the AV/IT</text><text x="26" y="939" font-family="Arial" font-size="25" font-weight="400" fill="#101010">facilities available in classrooms and lecture</text><text x="26" y="983" font-family="Arial" font-size="25" font-weight="400" fill="#101010">theatres via the AV/IT Facilities Search Engine</text><text x="26" y="1027" font-family="Arial" font-size="25" font-weight="400" fill="#101010">below. Request for support can be directed to</text><text x="26" y="1071" font-family="Arial" font-size="25" font-weight="400" fill="#101010">the hotline at </text><g id="LoadingMark"><image x="265" y="538" width="49" height="46" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/></g><g id="UnderlyingRoomHeader"><rect x="0" y="0" width="576" height="100" rx="0" fill="#FFFFFF"/><text x="288" y="75" font-family="Arial" font-size="27" font-weight="400" fill="#101010" text-anchor="middle">Room Finder</text><path d="M34 57L27 65L34 72" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round"/></g><g id="WebTop"><rect x="8" y="76" width="561" height="76" rx="24" fill="#F7F9F7"/><rect x="8" y="110" width="561" height="42" rx="0" fill="#F7F9F7"/><rect x="8" y="141" width="561" height="11" rx="0" fill="#DFDFDF"/><g id="ClosePreview"><rect x="17" y="88" width="50" height="49" rx="0" fill="#F7F9F7"/><path d="M32 104L52 124M52 104L32 124" fill="none" stroke="#303330" stroke-width="3.5" stroke-linecap="round"/></g><g id="MoreMenu"><rect x="500" y="88" width="53" height="47" rx="0" fill="#F7F9F7"/><circle cx="515" cy="113" r="4.2" fill="#333"/><circle cx="528" cy="113" r="4.2" fill="#333"/><circle cx="541" cy="113" r="4.2" fill="#333"/></g></g><g id="BrowserToolbar"><rect x="0" y="879" width="576" height="91" rx="25" fill="#F7F9F7"/><rect x="0" y="879" width="576" height="42" rx="0" fill="#F7F9F7"/><path d="M8 878.5H570" stroke="#BBB"/><g id="BrowserBackUnobserved"><path d="M55 910L42 924L55 938" stroke="#B3B5B3" stroke-width="4" stroke-linecap="round" fill="none"/></g><g id="BrowserForwardUnobserved"><path d="M111 910L124 924L111 938" stroke="#B3B5B3" stroke-width="4" stroke-linecap="round" fill="none"/></g><rect x="151" y="895" width="388" height="60" rx="13" fill="#FFFFFF" stroke="#9D9D9D"/><g id="Address"><text x="200" y="934" font-family="Arial" font-size="22" font-weight="400" fill="#777">www.polyu.edu.hk/learn...</text><rect x="175" y="923" width="13" height="10" rx="1.5" fill="#202020"/><path d="M178 923V920a4 4 0 0 1 8 0v3" transform="translate(0,0)" fill="none" stroke="#202020" stroke-width="2"/></g><g id="ReloadUnobserved"><path d="M524 925A12 12 0 1 1 510 916M510 910L518 916L511 922" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>